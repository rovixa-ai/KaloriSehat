
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Masuk — KaloriKu</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>

<body>
  <main class="login-page">
    <section class="login-card">

      <img
        src="assets/rovixa-icon.png"
        alt="KaloriKu"
        class="login-logo"
      >

      <span class="login-eyebrow">
        SELAMAT DATANG
      </span>

      <h1>Masuk ke KaloriKu</h1>

      <p>
        Pantau makanan, kalori, dan perkembangan
        kesehatan Anda dengan lebih mudah.
      </p>

      <button
        type="button"
        id="googleLoginButton"
        class="google-login-button"
      >
        <span class="google-icon">G</span>
        Lanjutkan dengan Google
      </button>

      <button
        type="button"
        id="guestLoginButton"
        class="guest-login-button"
      >
        Lanjut sebagai Tamu
      </button>

      <small class="login-footer">
        Dengan melanjutkan, Anda menyetujui penggunaan
        aplikasi KaloriKu.
      </small>

    </section>
  </main>

  <script type="module" src="./js/login.js"></script>
</body>
</html>
